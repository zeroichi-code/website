<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zeroichi-code</title>

    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "wxbmoycyfc");
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      html, body { margin: 0; background: #F5EDDA; font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/plain" id="app-source">
      const { useState, useEffect } = React;
      const { createRoot } = ReactDOM;

      /* ── インラインSVGアイコン ── */
      const Icon = ({ d, size = 16 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d={d} />
        </svg>
      );
      const IconSmartphone  = (p) => <Icon {...p} d="M17 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM12 18h.01" />;
      const IconCalculator  = (p) => <Icon {...p} d="M4 2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM8 6h8M8 10h2m4 0h2M8 14h2m4 0h2M8 18h2m4 0h2" />;
      const IconFileText    = (p) => <Icon {...p} d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8m8 4H8m2-8H8" />;
      const IconTwitter     = (p) => <Icon {...p} d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z" />;
      const IconExternalLink= (p) => <Icon {...p} d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6m4-3h6v6m-11 5L21 3" />;
      const IconCpu         = (p) => <Icon {...p} d="M9 2H15M9 22H15M2 9V15M22 9V15M9 9h6v6H9zM6 6l2 2M18 6l-2 2M6 18l2-2M18 18l-2-2" />;
      const IconZap         = (p) => <Icon {...p} d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />;
      const IconTerminal    = (p) => <Icon {...p} d="M4 17l6-6-6-6m8 14h8" />;
      const IconArrowUpRight= (p) => <Icon {...p} d="M7 17L17 7M7 7h10v10" />;

      /* ── カラーパレット ── */
      const C = {
        cream:  "#F5EDDA",
        maroon: "#2b1507",
        orange: "#F07A3A",
        pink:   "#F87AC0",
        lime:   "#C5E142",
        blue:   "#5B9BD5",
        yellow: "#F5C842",
      };

      /* ── プロフィールデータ ── */
      const PROFILE = {
        tagline: "building tiny tools, one bit at a time",
        androidApp: {
          name: "エリオット波動、自動カウンティングAPP",
          desc: "Google Play で近日リリース予定",
          status: "COMING SOON",
          href: "https://play.google.com/apps/testing/com.zeroichicode.fxelliottwave",
        },
        tools: [
          { name: "Token Usage",           desc: "Claude Token使用量をリアルタイム表示", Icon: IconZap,         href: "https://github.com/zeroichi-code/cc-checker",                                           bg: C.yellow, fg: C.maroon },
          { name: "楽天利益計算ツール",     desc: "せどりツール",                        Icon: IconCalculator,  href: "https://rakuten-searcher-capximdv9u43k4dkkmbtnc.streamlit.app/",                         bg: C.lime,   fg: C.maroon },
          { name: "楽天ROOMオリ写自動生成", desc: "時短ツール",                          Icon: IconCpu,         href: "https://drive.google.com/file/d/1GkGtXIW50fFxgmBYln4fb3sg-ZjzWVyb/view?usp=drive_link", bg: C.pink,   fg: C.maroon },
          { name: "楽天ROOM 片思いリスト",  desc: "フォロワー管理ツール",                Icon: IconTerminal,    href: "https://drive.google.com/file/d/17acc3EH626jUYfXu-zIIIo9gH8cEOT1U/view?usp=drive_link",  bg: C.blue,   fg: C.cream  },
        ],
        notes: [
          { title: "終わったはずの『AI塗り絵本KDP』：ミクロニッチで稼ぐ全手順【2026年完全アップデート版】", date: "05.22", href: "https://note.com/zeroichi_python/n/n9556e7a45b35" },
          { title: "海外で売るNotionテンプレ＆AIプロンプト集：月3万円から月45万円まで、円安レバレッジで稼ぐ全手順", date: "05.14", href: "https://note.com/zeroichi_python/n/neae154c5a61e?from=notice" },
          { title: "【楽天ROOMツール配布】オリ写素材を簡単作成、コメント自動生成", date: "04.30", href: "https://note.com/zeroichi_python/n/n5d35fb1a1cab" },
          { title: "【せどりツール配布】楽天利益商品検索、「楽天もりもりの森」公開", date: "04.26", href: "https://note.com/zeroichi_python/n/n425d1ec5dc46" },
        ],
        links: {
          x:    "https://x.com/zeroichi_code",
          note: "https://note.com/zeroichi_python",
        },
      };

      function StatusBar() {
        const [time, setTime] = useState("");
        useEffect(() => {
          const tick = () => {
            const d = new Date();
            setTime(`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`);
          };
          tick();
          const id = setInterval(tick, 30000);
          return () => clearInterval(id);
        }, []);
        return (
          <div style={{ background: C.maroon, color: C.cream }}
            className="flex items-center justify-between px-5 py-2 text-[11px] font-mono tracking-widest">
            <span>{time}</span>
            <span className="opacity-60">zeroichi-code</span>
          </div>
        );
      }

      function ProfileSite() {
        return (
          <div style={{ background: C.cream }} className="min-h-screen flex items-start justify-center py-8 px-3">
            <div className="w-full max-w-[400px] overflow-hidden rounded-[28px] border-4"
              style={{ borderColor: C.maroon, boxShadow: `6px 6px 0 ${C.maroon}` }}>

              {/* ノッチ */}
              <div style={{ background: C.maroon }} className="flex justify-center py-2">
                <div className="w-16 h-1.5 rounded-full opacity-30" style={{ background: C.cream }} />
              </div>

              <StatusBar />

              {/* HEADER */}
              <div style={{ background: C.maroon, color: C.cream }} className="px-5 pt-5 pb-6">
                <div className="text-[10px] font-mono tracking-widest opacity-50 mb-1">ゼロイチ</div>
                <h1 className="text-3xl font-black leading-none tracking-tight">
                  @zeroichi<span style={{ color: C.orange }}>-code</span>
                </h1>
                <p className="text-[11px] mt-2 opacity-60 font-mono leading-relaxed">{PROFILE.tagline}</p>
              </div>

              {/* ANDROID APP */}
              <a href={PROFILE.androidApp.href} target="_blank" rel="noreferrer"
                className="block hover:opacity-90 active:opacity-75 transition-opacity">
                <div style={{ background: C.orange, borderTop: `4px solid ${C.maroon}` }} className="px-5 py-5">
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-[9px] font-black tracking-[0.2em]" style={{ color: C.maroon }}>ANDROID APP</span>
                    <span className="text-[9px] font-black px-2 py-1 rounded-full animate-pulse"
                      style={{ background: C.maroon, color: C.cream }}>● {PROFILE.androidApp.status}</span>
                  </div>
                  <div className="flex items-center gap-4">
                    <div className="w-14 h-14 rounded-2xl overflow-hidden border-2 shrink-0"
                      style={{ borderColor: C.maroon }}>
                      <img src="./icon.png" alt="app icon" className="w-full h-full object-cover" />
                    </div>
                    <div className="flex-1">
                      <div className="font-black text-base leading-tight" style={{ color: C.maroon }}>{PROFILE.androidApp.name}</div>
                      <div className="text-[11px] mt-0.5 font-medium opacity-70" style={{ color: C.maroon }}>{PROFILE.androidApp.desc}</div>
                    </div>
                    <span style={{ color: C.maroon }}><IconArrowUpRight size={20} /></span>
                  </div>
                </div>
              </a>

              {/* TOOLS */}
              <div style={{ background: C.cream, borderTop: `4px solid ${C.maroon}` }} className="px-4 pt-4 pb-5">
                <span className="text-[9px] font-black tracking-[0.2em] mb-3 block" style={{ color: C.maroon }}>TOOLS</span>
                <div className="grid grid-cols-2 gap-3">
                  {PROFILE.tools.map((t, i) => (
                    <a key={i} href={t.href} target="_blank" rel="noreferrer"
                      className="block rounded-2xl border-2 p-4 transition-all duration-150 hover:-translate-y-0.5 active:translate-y-0.5"
                      style={{ background: t.bg, borderColor: C.maroon, boxShadow: `3px 3px 0 ${C.maroon}` }}>
                      <div className="flex items-center gap-2 mb-1.5">
                        <div className="w-7 h-7 rounded-lg flex items-center justify-center border-2 shrink-0"
                          style={{ background: t.fg, borderColor: C.maroon, color: t.bg }}>
                          <t.Icon size={14} />
                        </div>
                        <div className="text-xs font-black leading-tight" style={{ color: t.fg }}>{t.name}</div>
                      </div>
                      <div className="text-[10px] font-medium opacity-70" style={{ color: t.fg }}>{t.desc}</div>
                    </a>
                  ))}
                </div>
              </div>

              {/* NOTE LOG */}
              <div style={{ background: C.maroon, borderTop: `4px solid ${C.maroon}` }}>
                <div className="px-5 pt-4 pb-1 flex items-center justify-between">
                  <span className="text-[9px] font-black tracking-[0.2em]" style={{ color: C.lime }}>NOTE.LOG</span>
                  <span className="text-[9px] font-mono animate-pulse" style={{ color: C.lime }}>● live</span>
                </div>
                <div className="px-3 pb-4">
                  {PROFILE.notes.map((n, i) => (
                    <a key={i} href={n.href} target="_blank" rel="noreferrer"
                      className="flex items-center gap-3 px-3 py-2.5 rounded-xl my-1 hover:opacity-80 transition-opacity"
                      style={{ background: "rgba(245,237,218,0.07)" }}>
                      <span className="text-[10px] font-mono shrink-0 opacity-50" style={{ color: C.cream }}>{n.date}</span>
                      <span className="text-[12px] font-semibold flex-1 truncate" style={{ color: C.cream }}>{n.title}</span>
                      <span style={{ color: C.cream, opacity: 0.4 }}><IconExternalLink size={12} /></span>
                    </a>
                  ))}
                </div>
              </div>

              {/* SNS */}
              <div style={{ background: C.cream, borderTop: `4px solid ${C.maroon}` }} className="px-5 py-5 flex gap-3">
                <a href={PROFILE.links.x} target="_blank" rel="noreferrer"
                  className="flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-black text-sm border-2 transition-transform hover:-translate-y-0.5"
                  style={{ background: C.maroon, color: C.cream, borderColor: C.maroon, boxShadow: `3px 3px 0 ${C.orange}` }}>
                  <IconTwitter size={16} /> X
                </a>
                <a href={PROFILE.links.note} target="_blank" rel="noreferrer"
                  className="flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-black text-sm border-2 transition-transform hover:-translate-y-0.5"
                  style={{ background: C.cream, color: C.maroon, borderColor: C.maroon, boxShadow: `3px 3px 0 ${C.maroon}` }}>
                  <IconFileText size={16} /> note
                </a>
              </div>

              {/* フッター */}
              <div style={{ background: C.maroon, color: C.cream }}
                className="text-center py-2.5 text-[10px] font-mono opacity-40 tracking-widest">
                © {new Date().getFullYear()} zeroichi-code
                <div className="mt-2">
                  <img src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fzeroichi-code.github.io%2Fwebsite%2F&label=visitors&labelColor=%232b1507&countColor=%23F07A3A&style=flat"
                    alt="visitor count" className="mx-auto" />
                </div>
              </div>

            </div>
          </div>
        );
      }

      createRoot(document.getElementById("root")).render(<ProfileSite />);
    </script>

    <script>
      var src = document.getElementById("app-source").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      new Function(out)();
    </script>
  </body>
</html>
